<!DOCTYPE html>
<html lang="es" class="bloqueado">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Darwin · 13.11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#000; --hueso:#e8e3d8; --gris:#8d867c; --rojo:#9b1317; --rojo-v:#d11a20;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--negro)}
html.bloqueado,html.bloqueado body{overflow:hidden;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--negro);color:var(--hueso);font-family:var(--serif);-webkit-font-smoothing:antialiased}

/* PORTADA */
#cover{position:fixed;inset:0;z-index:5;background:#000;display:grid;place-items:center;cursor:pointer;overflow:hidden}
#cover.fuera{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .7s ease,visibility 0s .7s}
.stage{position:relative;width:min(100vw,66.667vh);width:min(100vw,66.667dvh);aspect-ratio:2/3;transform-origin:50% 40%;
  transition:transform 2.1s cubic-bezier(.55,0,.9,.45),filter 2.1s ease-in}
.stage img{display:block;width:100%;height:100%;animation:aparece 3s ease-out both;
  -webkit-mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent)}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.opening .stage{transform:scale(2.7);filter:brightness(0)}
.entrar{position:absolute;left:50%;top:77.5%;width:30%;height:6.5%;transform:translate(-50%,-50%);
  border:0;border-radius:999px;background:transparent;cursor:pointer;animation:latido 3s ease-in-out 3s infinite}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(209,26,32,0)}50%{box-shadow:0 0 22px 3px rgba(209,26,32,.38)}}
.entrar:focus-visible{outline:2px solid var(--hueso);outline-offset:6px}

/* INVITACIÓN */
#inv{position:relative;min-height:100vh;min-height:100dvh;isolation:isolate}
#inv::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--img) center 15%/cover no-repeat;opacity:.15;filter:grayscale(.5) blur(1.5px)}
#inv::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(#000 0,rgba(0,0,0,.2) 40%,#000 100%)}
.wrap{max-width:30rem;margin:0 auto;padding:4rem 1.6rem 3.5rem;text-align:center}
.r{opacity:0;filter:blur(6px);transition:opacity 1.7s ease,filter 1.7s ease;transition-delay:calc(var(--i,0)*.6s)}
#inv.on .r{opacity:1;filter:none}
.fecha{margin:0;font-size:.9rem;letter-spacing:.55em;padding-left:.55em;color:var(--hueso)}
.hilo{position:relative;width:1px;height:3.6rem;margin:1.1rem auto 1.6rem;background:var(--rojo-v)}
.hilo::after{content:"";position:absolute;left:-.55rem;top:2.3rem;width:1.1rem;height:1px;background:var(--rojo-v)}
h1{margin:0;font-weight:500;font-size:clamp(2.8rem,15vw,5.4rem);letter-spacing:.2em;padding-left:.2em;line-height:1}
h1 .t{display:inline-block;animation:parpadeo 2.4s .4s both}
@keyframes parpadeo{0%{opacity:0}8%{opacity:.9}10%{opacity:.05}15%{opacity:1}34%{opacity:1}36%{opacity:.2}39%{opacity:1}100%{opacity:1}}
.lema{margin:1.4rem 0 3rem;font-style:italic;font-size:1.3rem;color:var(--gris);letter-spacing:.04em}
.datos{margin:0 0 2.8rem;text-align:left}
.dato{border-top:1px solid rgba(155,19,23,.6);padding:1.1rem 0 1.15rem;display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.dato:last-child{border-bottom:1px solid rgba(155,19,23,.6)}
.dato dt{font-size:.74rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gris);flex:none}
.dato dd{margin:0;font-size:1.5rem;text-align:right;line-height:1.2}
.cuenta{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:0 0 .5rem}
.cuenta b{display:block;font-weight:500;font-size:2.6rem;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.cuenta span{display:block;margin-top:.5rem;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gris)}
.cuenta-nota{margin:0 0 3rem;font-style:italic;color:var(--gris);font-size:1.05rem}
.acciones{display:flex;flex-direction:column;align-items:center;gap:1rem}
.btn{display:inline-block;min-width:15rem;padding:.95rem 2rem;border:1px solid var(--rojo-v);border-radius:999px;color:var(--hueso);text-decoration:none;
  font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;transition:background .3s,box-shadow .3s}
.btn:hover{background:rgba(209,26,32,.16);box-shadow:0 0 22px rgba(209,26,32,.3)}
.btn.sec{border-color:rgba(141,134,124,.5);color:var(--gris)}
.btn:focus-visible{outline:2px solid var(--hueso);outline-offset:4px}
.pie{margin:3.2rem 0 0;font-style:italic;color:var(--gris);font-size:1.05rem}
.sonido{position:fixed;z-index:6;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));padding:.55rem 1.1rem;border:1px solid rgba(141,134,124,.5);border-radius:999px;
  background:rgba(0,0,0,.65);color:var(--gris);font:inherit;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;cursor:pointer}
.sonido:hover{color:var(--hueso);border-color:var(--rojo-v)}
.sonido:focus-visible{outline:2px solid var(--hueso);outline-offset:3px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){
  .opening .stage{transform:none}
  .stage,.r{transition-duration:.3s;transition-delay:0s}
  .stage img,h1 .t,.entrar{animation:none}
}
</style>
</head>
<body>

<div id="cover" role="presentation">
  <div class="stage">
    <img id="portada" alt="Máscara de hockey entre la niebla. Darwin, 13 de noviembre. ¿Te atreves a entrar?" width="720" height="1080">
    <button class="entrar" type="button" aria-label="Entrar a la invitación"></button>
  </div>
</div>

<main id="inv" hidden>
  <div class="wrap">
    <p class="fecha r" style="--i:0">13 · 11 · 2026</p>
    <div class="hilo r" style="--i:1" aria-hidden="true"></div>
    <h1 class="r" style="--i:1.5"><span class="t">DARWIN</span></h1>
    <p class="lema r" style="--i:3">La noche apenas comienza.</p>

    <dl class="datos">
      <div class="dato r" style="--i:4"><dt>Fecha</dt><dd>Viernes 13 de noviembre</dd></div>
      <div class="dato r" style="--i:4.6"><dt>Hora</dt><dd id="d-hora"></dd></div>
      <div class="dato r" style="--i:5.2"><dt>Lugar</dt><dd id="d-lugar"></dd></div>
      <div class="dato r" style="--i:5.8"><dt>Dress code</dt><dd id="d-dress"></dd></div>
    </dl>

    <div class="cuenta r" style="--i:6.6" role="timer" aria-live="off">
      <div><b id="c-d">00</b><span>días</span></div>
      <div><b id="c-h">00</b><span>horas</span></div>
      <div><b id="c-m">00</b><span>min</span></div>
      <div><b id="c-s">00</b><span>seg</span></div>
    </div>
    <p class="cuenta-nota r" style="--i:6.8" id="c-nota">Para que empiece.</p>

    <div class="acciones r" style="--i:7.4">
      <a class="btn" id="b-rsvp" target="_blank" rel="noopener">Confirmar asistencia</a>
      <a class="btn sec" id="b-mapa" target="_blank" rel="noopener" hidden>Ver ubicación</a>
    </div>
    <p class="pie r" style="--i:8">Es viernes 13. No llegues tarde.</p>
  </div>
</main>
<button class="sonido" id="b-sonido" type="button" hidden>Silenciar</button>

$("d-dress").textContent = DATOS.dress;
var msg = "Confirmo mi asistencia al cumpleaños de Darwin, 13 de noviembre 🖤";
$("b-rsvp").href = "https://wa.me/" + DATOS.whatsapp.replace(/\D/g,"") + "?text=" + encodeURIComponent(msg);
var mapa = DATOS.mapsUrl || (DATOS.direccion ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(DATOS.direccion) : "");
if (mapa) { $("b-mapa").href = mapa; $("b-mapa").hidden = false; }

var meta = new Date(2026, 10, 13, DATOS.horaH, DATOS.horaM, 0);
function dos(n){ return (n < 10 ? "0" : "") + n; }
function tic(){
  var s = Math.floor((meta - new Date()) / 1000);
  if (s <= 0) { ["c-d","c-h","c-m","c-s"].forEach(function(i){ $(i).textContent = "00"; }); $("c-nota").textContent = "Ya empezó."; return; }
  $("c-d").textContent = dos(Math.floor(s / 86400));
  $("c-h").textContent = dos(Math.floor(s % 86400 / 3600));
  $("c-m").textContent = dos(Math.floor(s % 3600 / 60));
  $("c-s").textContent = dos(s % 60);
}
tic(); setInterval(tic, 1000);

/* ===== MÚSICA: se genera en el navegador (no hay archivos de audio) ===== */
var AC = null, master = null, silencio = false;
function iniciarMusica(){
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
    master.gain.linearRampToValueAtTime(0.55, AC.currentTime + 6);
    var filtro = AC.createBiquadFilter(); filtro.type = "lowpass"; filtro.frequency.value = 380; filtro.Q.value = 2; filtro.connect(master);
    var lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 0.06; lg.gain.value = 180;
    lfo.connect(lg); lg.connect(filtro.frequency); lfo.start();
    [[55,"sine",.34],[55.45,"triangle",.2],[82.4,"sine",.2],[116.5,"triangle",.1],[27.5,"sine",.3]].forEach(function(n){
      var o = AC.createOscillator(), g = AC.createGain(); o.type = n[1]; o.frequency.value = n[0]; g.gain.value = n[2];
      o.connect(g); g.connect(filtro); o.start();
    });
    var len = AC.sampleRate * 3, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var ruido = AC.createBufferSource(); ruido.buffer = buf; ruido.loop = true;
    var bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 520; bp.Q.value = 0.7;
    var ng = AC.createGain(); ng.gain.value = 0.05;
    var l2 = AC.createOscillator(), l2g = AC.createGain(); l2.frequency.value = 0.11; l2g.gain.value = 260; l2.connect(l2g); l2g.connect(bp.frequency); l2.start();
    ruido.connect(bp); bp.connect(ng); ng.connect(master); ruido.start();
    var eco = AC.createDelay(2); eco.delayTime.value = 0.7; var fb = AC.createGain(); fb.gain.value = 0.5;
    eco.connect(fb); fb.connect(eco); eco.connect(master);
    var notas = [220, 233.1, 311.1, 329.6, 440, 466.2];
    (function fantasma(){
      if (AC) {
        var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
        o.type = "sine"; o.frequency.value = notas[Math.floor(Math.random() * notas.length)];
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.09, t + 2); g.gain.exponentialRampToValueAtTime(0.0005, t + 7);
        o.connect(g); g.connect(master); g.connect(eco); o.start(t); o.stop(t + 7.5);
      }
      setTimeout(fantasma, 6000 + Math.random() * 7000);
    })();
  } catch (e) { AC = null; }
}
function alternarSonido(){
  if (!AC) return;
  silencio = !silencio;
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setTargetAtTime(silencio ? 0 : 0.55, AC.currentTime, 0.4);
  $("b-sonido").textContent = silencio ? "Activar sonido" : "Silenciar";
}
$("b-sonido").addEventListener("click", alternarSonido);
document.addEventListener("visibilitychange", function(){
  if (!AC) return;
  if (document.hidden) AC.suspend(); else if (!silencio) AC.resume();
});

var abierto = false;
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function abrir(){
  if (abierto) return; abierto = true;
  $("cover").classList.add("opening");
  iniciarMusica();
  setTimeout(function(){
    $("inv").hidden = false;
    document.documentElement.classList.remove("bloqueado");
    window.scrollTo(0, 0);
    if (AC) $("b-sonido").hidden = false;
    $("cover").classList.add("fuera");
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ $("inv").classList.add("on"); }); });
  }, reduce ? 300 : 2100);
}
$("cover").addEventListener("click", abrir);
</script>
